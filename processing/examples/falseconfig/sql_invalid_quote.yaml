---
schemas:
- name: rides_sql_malformed
  topic:
    name: movr.public.rides_sql_malformed
    numPartitions: 1
    replicationFactor: 3
    config:
    - key: max.message.bytes
      value: "128000"
  changeFeed:
    fullTableName: movr.public.rides
    options:
    - full_table_name
    - on_error = 'pause'
    - protect_data_from_gc_on_pause
    - updated
  sql:
    columns:
    - id
    query: "SELECT id,city,vehicle_city,rider_id,vehicle_id,start_address,end_address,start_time,end_time,revenue FROM rides
  elasticsearch:
    index:
      name: rides_sql_malformed
      create: true
    mapping:
      settings:
        index.requests.cache.enable: true
        index:
          number_of_shards: 3
          number_of_replicas: 2
        analysis:
          normalizer:
            lowerasciinormalizer:
              type: custom
              filter:
              - lowercase
              - asciifolding
      mappings:
        dynamic_templates:
        - string_as_keyword:
            match_mapping_type: string
            match: '*'
            mapping:
              type: keyword
              normalizer: lowerasciinormalizer
        properties:
          id:
            type: keyword
          city:
            normalizer: lowerasciinormalizer
            type: keyword
          vehicle_city:
            normalizer: lowerasciinormalizer
            type: keyword
          rider_id:
            type: keyword
          vehicle_id:
            type: keyword
          start_address:
            normalizer: lowerasciinormalizer
            type: keyword
          end_address:
            normalizer: lowerasciinormalizer
            type: keyword
          start_time:
            type: date
          end_time:
            type: date
          revenue:
            type: float
          type:
            normalizer: lowerasciinormalizer
            type: keyword
